name: Deploy Audit

on:
  push:
    branches: [main]
    paths:
      - 'apps/audit-platform/**'
      - '.github/workflows/deploy-audit.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy Audit
        timeout-minutes: 20
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'DEPLOY'
            set -e
            cd /opt/repos/bubblestone
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker build -t bubblestone-audit:latest apps/audit-platform/
            docker compose -f infra/docker-compose.yml -p projects up -d bubblestone-audit
            sleep 10
            curl -sf http://127.0.0.1:8080/ > /dev/null || { echo "Health check failed"; exit 1; }
            echo "Audit deployed successfully"
          DEPLOY
