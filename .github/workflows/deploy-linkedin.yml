name: Deploy LinkedIn

on:
  push:
    branches: [main]
    paths:
      - 'apps/linkedin-generator/**'
      - '.github/workflows/deploy-linkedin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy LinkedIn Generator
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'DEPLOY'
            set -e
            cd /opt/repos/bubblestone
            git checkout main
            git pull --ff-only origin main
            docker build -t linkedin-generator:latest apps/linkedin-generator/
            docker compose -f infra/docker-compose.yml -p projects up -d linkedin-generator
            sleep 5
            curl -sf http://127.0.0.1:5001/ > /dev/null || { echo "Health check failed"; exit 1; }
            echo "LinkedIn Generator deployed successfully"
          DEPLOY
