name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Semgrep — static analysis (OWASP, injection, XSS, etc.)
  # Diff-aware: on PRs, only scans changed files. On push to main, full scan (non-blocking).
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep (diff-aware on PRs)
        env:
          SEMGREP_BASELINE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          BASELINE_ARG=""
          if [ -n "$SEMGREP_BASELINE_REF" ]; then
            BASELINE_ARG="--baseline-commit $SEMGREP_BASELINE_REF"
          fi
          semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/javascript \
            $BASELINE_ARG \
            --json --output semgrep-results.json \
            --exclude='node_modules' --exclude='.git' --exclude='dist' \
            . || true

      - name: Check for critical findings
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f semgrep-results.json ]; then
            python3 -c "
          import json, os, sys
          data = json.load(open('semgrep-results.json'))
          results = data.get('results', [])
          errors = [r for r in results if r.get('extra', {}).get('severity', '') == 'ERROR']
          warnings = [r for r in results if r.get('extra', {}).get('severity', '') == 'WARNING']
          for r in (errors + warnings)[:15]:
              sev = r['extra']['severity']
              cid = r['check_id']
              path = r['path']
              line = r['start']['line']
              msg = r.get('extra', {}).get('message', '')[:120]
              print(f'  {sev}: {cid}')
              print(f'    {path}:{line}')
              print(f'    {msg}')
              print()
          print(f'Total: {len(errors)} critical, {len(warnings)} warnings')
          if errors and os.environ.get('EVENT_NAME') == 'pull_request':
              print('::error::Critical security findings in changed files')
              sys.exit(1)
          if errors:
              print('Critical findings reported on main push; not blocking existing baseline.')
              sys.exit(0)
          print('No critical findings in changed files.')
          "
          fi

  # 2. Trivy — dependency vulnerabilities + Dockerfile scan
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan Dockerfiles
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # 3. Secret detection — prevent credential leaks
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
