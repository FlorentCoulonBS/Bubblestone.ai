[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trend-monitor"
version = "0.1.0"
description = "Detect genuinely revolutionary AI developments 1-2 days before other content creators"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "sqlmodel>=0.0.14",
    "rapidfuzz>=3.5",
    "rich>=13.7",
    "sentence-transformers",
    "feedparser",
    "beautifulsoup4",
    "lxml",
    "playwright",
    "flask",
    "flask-httpauth",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.2",
]

[project.scripts]
ai-trend-monitor = "ai_trend_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
