[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:gunicorn]
command=/usr/local/bin/gunicorn -w 2 --timeout 120 -b 0.0.0.0:5000 ai_trend_monitor.web.app:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_PATH="/data/trends.db",OPML_PATH="/data/feeds.opml"

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
