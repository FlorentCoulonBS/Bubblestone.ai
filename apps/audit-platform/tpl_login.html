<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — BubbleStone.ai</title>
<link rel="icon" type="image/svg+xml" href="https://bubblestone.ai/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563EB 0%,#7C3AED 100%)}
.login-card{background:#fff;border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,0.25)}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
.logo svg{width:48px;height:48px}
.logo-text{font-size:24px;font-weight:800;background:linear-gradient(135deg,#2563EB,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:12px;color:#6B7280}
h2{text-align:center;font-size:20px;color:#1F2937;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.field input{width:100%;padding:12px 16px;border:2px solid #E5E7EB;border-radius:10px;font-size:15px;transition:border .2s}
.field input:focus{outline:none;border-color:#2563EB}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:0.9}
.error{background:#FEE2E2;color:#991B1B;padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <svg viewBox="0 0 32 32" style="width:44px;height:44px;filter:drop-shadow(0 0 8px rgba(74,158,173,0.5));pointer-events:none"><defs><radialGradient id="sp" cx="35%" cy="35%" r="60%"><stop offset="0%" stop-color="#6ec6d6"/><stop offset="50%" stop-color="#2a8a9a"/><stop offset="100%" stop-color="#0d3a45"/></radialGradient></defs><circle cx="16" cy="16" r="15" fill="url(#sp)"><animate attributeName="r" values="14.5;15.5;14.5" dur="3s" repeatCount="indefinite"/></circle><circle cx="11" cy="11" r="4" fill="rgba(255,255,255,0.15)"><animate attributeName="r" values="3.5;4.5;3.5" dur="3s" repeatCount="indefinite"/></circle></svg>
    <div><div class="logo-text">BubbleStone.ai</div><div class="logo-sub">Audit Web Automatisé</div></div>
  </div>
  <h2>Connexion</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field"><label>Identifiant</label><input type="text" name="username" required autofocus></div>
    <div class="field"><label>Mot de passe</label><input type="password" name="password" required></div>
    <button type="submit" class="btn">Se connecter</button>
  </form>
</div>
</body>
</html>
