<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit en cours — BubbleStone.ai</title>
<link rel="icon" type="image/svg+xml" href="https://bubblestone.ai/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2563EB,#7C3AED)}
.card{background:#fff;border-radius:16px;padding:48px;text-align:center;max-width:480px;box-shadow:0 25px 50px rgba(0,0,0,0.25)}
.spinner{width:60px;height:60px;border:4px solid #E5E7EB;border-top:4px solid #2563EB;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:20px;margin-bottom:8px;color:#1F2937}
p{color:#6B7280;margin-bottom:16px}
.badge{display:inline-block;padding:4px 16px;border-radius:20px;font-size:13px;font-weight:700;color:#fff}
.badge-running{background:#F59E0B}.badge-pending{background:#9CA3AF}.badge-error{background:#DC2626}
</style>
</head>
<body>
<div class="card">
  {% if audit.status == 'error' %}
    <div style="font-size:48px;margin-bottom:16px">❌</div>
    <h2>Erreur lors de l'audit</h2>
    <p>{{ audit.domain }}</p>
    <span class="badge badge-error">error</span>
  {% else %}
    <div class="spinner"></div>
    <h2>Audit en cours...</h2>
    <p>{{ audit.domain or audit.url }}</p>
    <span class="badge badge-{{ audit.status }}">{{ audit.status }}</span>
  {% endif %}
</div>
<script>
{% if audit.status in ('pending', 'running') %}
setTimeout(()=>location.reload(), 5000);
{% endif %}
</script>
</body>
</html>
